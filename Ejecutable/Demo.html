function pintar(id,a){const c=document.getElementById(id);c.width=c.height=256;const ctx=c.getContext('2d'),im=ctx.createImageData(256,256);a.forEach((v,i)=>{im.data.set([v,v,v,255],4*i)});ctx.putImageData(im,0,0);}
function psnr(a){return 10*Math.log10(255**2*a.length/a.reduce((s,v,i)=>s+(v-original[i])**2,0));}
function ejecutar(){const K=Number(document.getElementById('k').value),r=restaurar(borrosa,256,K);pintar('out',r);document.getElementById('estado').textContent='PSNR de entrada '+psnr(borrosa).toFixed(2)+' dB · Salida '+psnr(r).toFixed(2)+' dB · K = '+K;document.getElementById('save').href=document.getElementById('out').toDataURL();}
